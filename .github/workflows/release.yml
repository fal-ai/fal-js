name: Release

on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - client
          - proxy
      version:
        description: "Version to release (e.g., 1.2.0, 1.3.0-alpha.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (will not publish to npm)"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: "Set npm version"
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Extract package info
        id: tag-info
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual trigger
            PACKAGE_NAME="$RELEASE_PACKAGE"
            VERSION="$RELEASE_VERSION"
          else
            # Tag trigger
            PACKAGE_NAME="${RELEASE_REF%%-v*}"
            VERSION="${RELEASE_REF#*-v}"
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^(client|proxy)$ ]] ||
             [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z]+\.[0-9]+)?$ ]]; then
            echo "Expected client/proxy and a version such as 1.2.0 or 1.3.0-alpha.0"
            exit 1
          fi

          # Extract npm tag based on version qualifier
          if [[ $VERSION =~ .*-([a-zA-Z]+)\.[0-9]+$ ]]; then
            NPM_TAG="${BASH_REMATCH[1]}"
          else
            NPM_TAG="latest"
          fi

          echo "package=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT

      - name: Check Agent SDK
        if: steps.tag-info.outputs.package == 'client'
        run: |
          npm run typecheck:agent
          npm run test:agent

      - name: Build package
        run: npx nx build ${{ steps.tag-info.outputs.package }} --prod

      - name: Verify package version
        run: |
          PACKAGE_JSON_VERSION=$(node -p "require('./dist/libs/${{ steps.tag-info.outputs.package }}/package.json').version")
          if [ "$PACKAGE_JSON_VERSION" != "${{ steps.tag-info.outputs.version }}" ]; then
            echo "Package version ($PACKAGE_JSON_VERSION) does not match tag version (${{ steps.tag-info.outputs.version }})"
            exit 1
          fi

      - name: Verify packed client on Node 18 and 22
        if: steps.tag-info.outputs.package == 'client'
        run: bash .github/scripts/verify-client-package.sh

      - name: Publish package
        run: |
          echo "Publishing ${{ steps.tag-info.outputs.package }}@${{ steps.tag-info.outputs.version }} with tag ${{ steps.tag-info.outputs.npm_tag }}"
          cd dist/libs/${{ steps.tag-info.outputs.package }}
          npm stage publish --access public --tag ${{ steps.tag-info.outputs.npm_tag }} ${{ inputs.dry_run && '--dry-run' || '' }}
